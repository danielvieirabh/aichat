<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danzin - AI Chat</title>
    <!-- Fonte Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        primary: '#4f46e5',
                        primaryHover: '#4338ca',
                        dark: '#0f172a',
                        panel: '#1e293b'
                    }
                }
            }
        }
    </script>

    <!-- Bibliotecas para Markdown e Highlight de Código -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-dark to-slate-900 text-slate-200 h-screen flex flex-col font-sans overflow-hidden selection:bg-primary selection:text-white">

<!-- Cabeçalho -->
<header class="bg-slate-900/70 backdrop-blur-xl border-b border-slate-700/50 p-4 sticky top-0 z-20 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-4">
        <div class="bg-gradient-to-tr from-indigo-600 to-blue-500 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/30">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
        </div>
        <div>
            <h1 class="text-xl font-semibold text-white tracking-wide">Danzin</h1>
            <p class="text-xs text-slate-400 font-medium">Seu assistente de IA local</p>
        </div>
    </div>
    <div class="hidden sm:flex text-xs bg-slate-800/80 px-4 py-2 rounded-full border border-slate-700/60 text-slate-300 shadow-inner items-center gap-2">
        <div class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></div>
        Sessão: <span id="session-id-display" class="font-mono text-indigo-400 font-semibold tracking-wider"></span>
    </div>
</header>

<!-- Área do Chat -->
<main id="chat-container" class="flex-1 overflow-y-auto p-4 sm:p-6 w-full max-w-4xl mx-auto space-y-6 scroll-smooth pb-32">
    <!-- Mensagem de Boas Vindas -->
    <div class="flex justify-center my-12 relative group" id="welcome-message">
        <div class="absolute inset-0 bg-gradient-to-r from-indigo-500 to-blue-500 blur-xl opacity-20 rounded-3xl group-hover:opacity-30 transition duration-500"></div>
        <div class="bg-panel/90 backdrop-blur-sm border border-slate-700/50 rounded-3xl p-8 max-w-md text-center shadow-2xl relative">
            <div class="bg-indigo-500/10 text-indigo-400 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-5 rotate-3 hover:rotate-0 transition-transform duration-300">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
            </div>
            <h2 class="text-xl font-semibold text-white mb-3">E aí, sou o Danzin!</h2>
            <p class="text-sm text-slate-400 leading-relaxed">Como posso te ajudar hoje? Envie um trecho de código, peça para redigir um texto ou faça perguntas complexas.</p>
        </div>
    </div>
</main>

<!-- Área de Input -->
<footer class="fixed bottom-0 w-full bg-gradient-to-t from-dark via-dark/95 to-transparent pt-10 pb-6 px-4 z-20">
    <div class="max-w-4xl mx-auto relative group">
        <form id="chat-form" class="relative shadow-2xl rounded-2xl bg-panel/80 backdrop-blur-xl border border-slate-700/50 focus-within:border-indigo-500/50 focus-within:ring-4 focus-within:ring-indigo-500/10 transition-all duration-300">
            <textarea
                    id="message-input"
                    rows="1"
                    class="w-full bg-transparent pl-5 pr-16 py-4 text-slate-100 placeholder-slate-500 focus:outline-none resize-none max-h-48 overflow-y-auto custom-scrollbar"
                    placeholder="Pergunte qualquer coisa ao Danzin..."
                    required
            ></textarea>
            <button
                    type="submit"
                    id="send-button"
                    class="absolute right-2 bottom-2 bg-gradient-to-r from-indigo-600 to-blue-600 hover:from-indigo-500 hover:to-blue-500 text-white p-2.5 rounded-xl transition-all shadow-md disabled:opacity-50 disabled:cursor-not-allowed transform hover:scale-105 active:scale-95 flex items-center justify-center"
            >
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
            </button>
        </form>
        <div class="text-center mt-3 text-[11px] text-slate-500 font-medium">
            Pressione <kbd class="bg-slate-800/80 px-1.5 py-0.5 rounded text-slate-300 border border-slate-700">Enter</kbd> para enviar
        </div>
    </div>
</footer>

<script src="script.js"></script>
</body>
</html>
